<!doctype html>
<!--
  Página para dar el permiso de cámara a la extensión, una sola vez por
  computadora. El documento offscreen de la cámara no puede mostrar el aviso de
  Chrome, así que el permiso se pide aquí; después el offscreen lo usa sin
  preguntar. Los textos vienen de strings.js.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SUCA · Cámara</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #1d1d1f;
      }
      button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        border-radius: 0.4rem;
        border: 0;
        background: #1a5fb4;
        color: #fff;
        cursor: pointer;
      }
      #status {
        margin-top: 1.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1 data-string="title"></h1>
    <p data-string="body"></p>
    <button type="button" id="allow" data-string="button"></button>
    <p id="status" role="status"></p>
    <script src="strings.js"></script>
    <script src="permission.js"></script>
  </body>
</html>
